name: Car battery status

# Every 30 min: read the ZOE's battery and save it to data/car.json for the phone widget.
# (GitHub may run scheduled jobs a few minutes late; fine for this.)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'renault-api>=0.6.3,<0.7'
      - name: Read battery
        env:
          RENAULT_EMAIL: ${{ secrets.RENAULT_EMAIL }}
          RENAULT_PASSWORD: ${{ secrets.RENAULT_PASSWORD }}
          RENAULT_DEVICE_IDS: ${{ secrets.RENAULT_DEVICE_IDS }}
          RENAULT_VIN: ${{ secrets.RENAULT_VIN }}
        run: python .github/scripts/car.py status
      - name: Commit
        run: |
          git config user.name "Weather Bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/car.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Car status update"
          # The weather bot pushes every minute, so retry on conflicts.
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 3))
          done
          exit 1

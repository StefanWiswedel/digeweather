name: Build Android widget

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dige-weather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dige-weather-apk
          path: dige-weather.apk

      # On main: publish to a fixed release so the phone always has the same download link.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: Dige Weather widget (latest)
          body: "Latest build of the Android widget app. Download dige-weather.apk on your phone and install it."
          prerelease: false
          make_latest: true
          files: dige-weather.apk
